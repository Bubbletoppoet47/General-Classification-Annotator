name: Build Windows programs

# Run it by hand: Actions tab > "Build Windows programs" > Run workflow.
#   publish unticked = just build the program and keep them as downloadable build artifacts (a dry run).
#   publish ticked   = also make the GitHub release "v<APP_VERSION>" (the number in src/app_update.py) and attach the zip.
# Pushing a tag like v1.0.0 does the same as ticking publish (the tag must match APP_VERSION).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also create the GitHub release and attach the programs"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-test.txt
      - name: Run the tests (information only - a failure here is shown but does not stop the build)
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          foreach ($t in Get-ChildItem tests/test_*.py) {
            python $t.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $($t.Name)"; $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install CPU PyTorch, then the rest
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r src/requirements.txt -r requirements-build.txt
      - run: pyinstaller packaging/annotator.spec --noconfirm
      - name: Self-test the built program (the AI packages must import)
        shell: pwsh
        run: |
          $p = Start-Process dist/GeneralClassificationAnnotator/GeneralClassificationAnnotator.exe -ArgumentList "--selftest","selftest.txt","--expect-ai" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no selftest output" }
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }
      - name: Zip the folder (GitHub allows 2000 MB per release file)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GeneralClassificationAnnotator -DestinationPath GeneralClassificationAnnotator.zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item GeneralClassificationAnnotator.zip).Length / 1MB)
          Write-Host "zip is $mb MB"
          if ($mb -ge 2000) { throw "the zip is $mb MB - over the 2000 MB GitHub limit for a release file" }
      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: GeneralClassificationAnnotator.zip

  publish:
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release-files, merge-multiple: true }
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('src/app_update.py').read()).group(1))")
          TAG="v$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match APP_VERSION ($TAG). Fix one of them."; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Raise APP_VERSION in src/app_update.py first."; exit 1
          fi
          python3 - <<'PY' > notes.md
          import sys
          sys.path.insert(0, "src")
          import app_update as au
          date, note = au.newest_entry(open("src/UPDATES.txt", encoding="utf-8").read())
          print(note or "See the CHANGELOG.")
          PY
          ls -l release-files
          gh release create "$TAG" release-files/* --target "$GITHUB_SHA" --title "General Classification Annotator $VERSION" --notes-file notes.md
